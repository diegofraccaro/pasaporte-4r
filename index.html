<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pasaporte 4R</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary-green: #00a046;
            --light-bg: #f4f9f4;
            --grey-inactive: #b0b0b0;
            --text-dark: #333333;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--light-bg);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            overflow-x: hidden; 
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            background-color: white;
            min-height: 100dvh;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        header { text-align: center; margin-bottom: 15px; }
        h1 { color: var(--primary-green); font-size: 32px; margin: 0 0 5px 0; }
        p { font-size: 15px; color: #555; margin: 0; line-height: 1.4; font-weight: 600;}

        /* Tablero de Progreso ARRIBA */
        .badges-container {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; 
            padding: 15px 10px; background: white; border-radius: 25px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 15px;
        }

        .badge-wrapper { display: flex; flex-direction: column; align-items: center; position: relative; width: 70px; gap: 6px; }
        .badge-circle { width: 60px; height: 60px; border-radius: 50%; border: 4px solid var(--grey-inactive); color: var(--grey-inactive); display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: 700; background-color: white; transition: all 0.4s ease; }
        .badge-label { font-size: 10px; font-weight: 700; color: var(--grey-inactive); text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-check { position: absolute; top: -4px; right: -2px; background-color: white; color: var(--primary-green); width: 24px; height: 24px; border-radius: 50%; display: none; justify-content: center; align-items: center; font-size: 14px; font-weight: bold; box-shadow: 0 3px 8px rgba(0,0,0,0.25); }

        .badge-wrapper.active .badge-circle { background-color: var(--primary-green); border-color: var(--primary-green); color: white; transform: scale(1.1); }
        .badge-wrapper.active .badge-label { color: var(--primary-green); }
        .badge-wrapper.active .badge-check { display: flex; }

        /* Controles de la cámara ABAJO */
        .scanner-section {
            background: white;
            border-radius: 30px;
            padding: 15px;
            box-shadow: 0 8px 30px rgba(0, 160, 70, 0.15);
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            flex-grow: 1; 
        }

        #reader { 
            width: 100%; 
            border-radius: 20px; 
            overflow: hidden; 
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #reader video { 
            object-fit: cover; 
            border-radius: 20px; 
            width: 100% !important;
            max-height: 40vh; 
        }

        .btn-iniciar-camara {
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 160, 70, 0.4);
            font-family: 'Poppins', sans-serif;
            margin: 30px 0;
            width: 80%;
        }

        #feedback { 
            text-align: center; font-weight: 700; font-size: 16px; 
            margin-top: 15px; min-height: 25px; color: var(--primary-green); 
            transition: all 0.2s ease;
        }

        /* === NUEVA CLASE PARA TEXTO REPETIDO (MÁS GRANDE Y TITILANDO) === */
        @keyframes titilar {
            0% { opacity: 1; }
            50% { opacity: 0.1; }
            100% { opacity: 1; }
        }
        .alerta-repetido {
            font-size: 40px !important; /* 150% más grande que los 16px base */
            line-height: 1.1;
            animation: titilar 0.5s infinite;
        }

        #pantalla-exito { 
            display: none; text-align: center; padding: 40px 20px; 
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            flex-grow: 1; justify-content: center; flex-direction: column; align-items: center;
        }
        #pantalla-exito h2 { color: var(--primary-green); font-size: 36px; margin-bottom: 10px; }
        #pantalla-exito p { font-size: 18px; margin-bottom: 25px; }
        
        .btn-descarga { 
            display: inline-block; background-color: var(--primary-green); color: white; 
            border: none; padding: 20px 40px; border-radius: 40px; 
            font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 20px; 
            box-shadow: 0 8px 25px rgba(0, 160, 70, 0.4); cursor: pointer; transition: transform 0.2s; 
        }
        .btn-descarga:active { transform: scale(0.95); }
        
        /* Mensaje Despedida Gigante y Vibrante */
        #mensaje-despedida {
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100vw; height: 100dvh; 
            z-index: 9999; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            color: #111;
            font-size: 64px; 
            font-weight: 700;
            line-height: 1.3;
            animation: popIn 0.5s ease-out, alternarFondo 2s infinite alternate;
        }

        @keyframes alternarFondo {
            0% { background-color: #FFEA00; }   
            50% { background-color: #00FFEA; }  
            100% { background-color: #FF007F; } 
        }

        @keyframes popIn { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <div class="app-container">
        <header id="app-header">
            <h1>🌎 Muestra 4R 🌿</h1>
            <p>Escaneá los 4 códigos para descubrir tu sorpresa.</p>
        </header>

        <div class="badges-container" id="badges-container">
            <!-- Círculos generados por JS -->
        </div>

        <div class="scanner-section" id="scanner-section">
            <div id="reader">
                <button id="btn-iniciar" class="btn-iniciar-camara" onclick="iniciarCamara()">📷 Activar Cámara</button>
            </div>
            <div id="feedback">Presioná el botón para comenzar</div>
        </div>

        <div id="pantalla-exito">
            <h2>¡Misión Cumplida! 🎉</h2>
            <p>Completaste las 4 estaciones de nuestro proyecto.</p>
            <button id="btn-souvenir" class="btn-descarga" onclick="revelarMensajeFinal()">🎁 Obtener Souvenir</button>
        </div>

        <div id="mensaje-despedida">
            <span>¡Gracias por participar! 🙌</span><br>
            <span style="font-size: 45px; font-weight: 600; margin-top: 20px; display: inline-block;">Podés pasar a buscar tu Souvenir mostrando esta pantalla por la salida.</span>
        </div>
    </div>

    <script>
        // ARCHIVOS OFICIALES DE GOOGLE (Sin bloqueos)
        const sonidoEscaneo = new Audio('https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg');
        const sonidoVictoria = new Audio('https://actions.google.com/sounds/v1/crowds/light_applause.ogg');

        const estaciones = [
            { id: "estacion1", titulo: "1°", codigoFisico: "REDUCIR" },
            { id: "estacion2", titulo: "2°", codigoFisico: "REUTILIZAR" },
            { id: "estacion3", titulo: "3°", codigoFisico: "RECICLAR" },
            { id: "estacion4", titulo: "4°", codigoFisico: "RECUPERAR" }
        ];

        let codigosEscaneados = new Set();
        const badgesContainer = document.getElementById('badges-container');
        let html5QrCode; 
        
        estaciones.forEach((estacion) => {
            let wrapper = document.createElement('div');
            wrapper.className = 'badge-wrapper';
            wrapper.id = `wrapper-${estacion.id}`;

            let circle = document.createElement('div');
            circle.className = 'badge-circle';
            circle.innerText = estacion.titulo; 

            let check = document.createElement('div');
            check.className = 'badge-check';
            check.innerText = '✓';

            let label = document.createElement('div');
            label.className = 'badge-label';
            label.id = `label-${estacion.id}`;
            label.innerText = 'INCOMPLETO';

            circle.appendChild(check);
            wrapper.appendChild(circle);
            wrapper.appendChild(label);
            badgesContainer.appendChild(wrapper);
        });

        function iniciarCamara() {
            const btn = document.getElementById('btn-iniciar');
            const feedback = document.getElementById('feedback');
            
            // TRUCO DE DESBLOQUEO SILENCIOSO PARA QUE EL CELULAR AUTORICE LOS AUDIOS LUEGO
            sonidoEscaneo.volume = 0;
            sonidoEscaneo.play().then(() => { 
                sonidoEscaneo.pause(); sonidoEscaneo.currentTime = 0; sonidoEscaneo.volume = 1; 
            }).catch(e=>{});
            
            sonidoVictoria.volume = 0;
            sonidoVictoria.play().then(() => { 
                sonidoVictoria.pause(); sonidoVictoria.currentTime = 0; sonidoVictoria.volume = 1; 
            }).catch(e=>{});

            btn.style.display = 'none'; 
            feedback.innerText = "Cargando cámara...";

            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess,
                (errorMessage) => { }
            ).then(() => {
                feedback.innerText = "Apuntá al código QR...";
            }).catch((err) => {
                btn.style.display = 'block';
                feedback.innerText = "Error: Verifica los permisos de la cámara.";
            });
        }

        function onScanSuccess(decodedText) {
            const feedback = document.getElementById('feedback');
            const estacionEncontrada = estaciones.find(est => est.codigoFisico === decodedText);

            if (estacionEncontrada) {
                if (!codigosEscaneados.has(estacionEncontrada.id)) {
                    codigosEscaneados.add(estacionEncontrada.id);
                    
                    document.getElementById(`wrapper-${estacionEncontrada.id}`).classList.add('active');
                    document.getElementById(`label-${estacionEncontrada.id}`).innerText = 'COMPLETO';
                    
                    // Nos aseguramos de quitar la clase de parpadeo si escanea uno correcto
                    feedback.classList.remove("alerta-repetido");
                    
                    feedback.innerText = `¡Estación ${estacionEncontrada.titulo} registrada!`;
                    feedback.style.color = "var(--primary-green)";

                    if (codigosEscaneados.size < estaciones.length) {
                        // REPRODUCE EL BOING PARA ESTACIONES 1, 2 Y 3
                        sonidoEscaneo.currentTime = 0;
                        sonidoEscaneo.play().catch(e => console.log(e));
                        
                        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                    }

                    verificarVictoria();
                } else {
                    // === AQUÍ SE ACTIVA EL TEXTO GIGANTE Y TITILANTE ===
                    feedback.innerText = `¡Ya visitaste la estación ${estacionEncontrada.titulo}!`;
                    feedback.style.color = "#d97706";
                    feedback.classList.add("alerta-repetido");
                }
            } else {
                feedback.classList.remove("alerta-repetido");
                feedback.innerText = "Código incorrecto para esta muestra.";
                feedback.style.color = "#dc2626";
            }
            
            setTimeout(() => {
                if(codigosEscaneados.size < estaciones.length) {
                    feedback.innerText = "Apuntá al siguiente QR...";
                    feedback.style.color = "var(--text-dark)";
                    
                    // Quitamos la clase para que el texto vuelva a su tamaño normal
                    feedback.classList.remove("alerta-repetido");
                }
            }, 3000);
        }

        function verificarVictoria() {
            if (codigosEscaneados.size === estaciones.length) {
                
                // DISPARA LOS APLAUSOS INMEDIATAMENTE AL LEER EL 4TO CÓDIGO
                sonidoVictoria.currentTime = 0;
                sonidoVictoria.play().catch(e => console.log(e));
                
                if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 600]);
                lanzarConfetti();

                // DESPUÉS APAGA LA CÁMARA (Así evitamos que el navegador bloquee el audio)
                html5QrCode.stop().then(() => {
                    document.getElementById('scanner-section').style.display = 'none';
                    document.getElementById('app-header').style.display = 'none';
                    document.getElementById('badges-container').style.display = 'none';
                    
                    let pantallaExito = document.getElementById('pantalla-exito');
                    pantallaExito.style.display = 'flex';
                }).catch(err => console.log("Error apagando cámara", err));
            }
        }

        function lanzarConfetti() {
            var duration = 3000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#00a046', '#ffd700', '#ff0000'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#00a046', '#ffd700', '#ff0000'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function revelarMensajeFinal() {
            document.getElementById('mensaje-despedida').style.display = 'flex';
            if (navigator.vibrate) navigator.vibrate(100);
        }
    </script>
</body>
</html>
