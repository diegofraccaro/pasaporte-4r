<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pasaporte 4R</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Librería pura para leer QR -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --primary-green: #00a046;
            --light-bg: #f4f9f4;
            --grey-inactive: #b0b0b0;
            --text-dark: #333333;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--light-bg);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            overflow-x: hidden; 
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            background-color: white;
            min-height: 100dvh;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            padding: 25px 20px;
            box-sizing: border-box;
        }

        header { text-align: center; margin-bottom: 15px; }
        h1 { color: var(--primary-green); font-size: 34px; margin: 0 0 10px 0; }
        p { font-size: 17px; color: #555; margin: 0; line-height: 1.5; font-weight: 600;}

        /* Controles de la cámara personalizados */
        .scanner-section {
            background: white;
            border-radius: 30px;
            padding: 15px;
            box-shadow: 0 8px 30px rgba(0, 160, 70, 0.15);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        #reader { 
            width: 100%; 
            min-height: 250px;
            border-radius: 20px; 
            overflow: hidden; 
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #reader video { 
            object-fit: cover; 
            border-radius: 20px; 
            width: 100% !important;
        }

        /* Nuestro propio botón para encender la cámara */
        .btn-iniciar-camara {
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 160, 70, 0.4);
            font-family: 'Poppins', sans-serif;
            margin: 20px 0;
            width: 80%;
        }

        #feedback { 
            text-align: center; font-weight: 700; font-size: 18px; 
            margin-top: 15px; min-height: 27px; color: var(--primary-green); 
        }

        /* Tablero de Progreso (Ahora adaptado para 4 opciones) */
        .badges-container {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; 
            padding: 20px 10px; background: white; border-radius: 30px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-top: auto;
        }

        .badge-wrapper { display: flex; flex-direction: column; align-items: center; position: relative; width: 85px; gap: 8px; }
        .badge-circle { width: 75px; height: 75px; border-radius: 50%; border: 4px solid var(--grey-inactive); color: var(--grey-inactive); display: flex; justify-content: center; align-items: center; font-size: 30px; font-weight: 700; background-color: white; transition: all 0.4s ease; }
        .badge-label { font-size: 11px; font-weight: 700; color: var(--grey-inactive); text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-check { position: absolute; top: -4px; right: 0px; background-color: white; color: var(--primary-green); width: 28px; height: 28px; border-radius: 50%; display: none; justify-content: center; align-items: center; font-size: 16px; font-weight: bold; box-shadow: 0 3px 8px rgba(0,0,0,0.25); }

        .badge-wrapper.active .badge-circle { background-color: var(--primary-green); border-color: var(--primary-green); color: white; }
        .badge-wrapper.active .badge-label { color: var(--primary-green); }
        .badge-wrapper.active .badge-check { display: flex; }

        /* Pantalla de Éxito Final */
        #pantalla-exito { 
            display: none; text-align: center; padding: 50px 20px; 
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            flex-grow: 1; justify-content: center; flex-direction: column;
        }
        #pantalla-exito h2 { color: var(--primary-green); font-size: 36px; margin-bottom: 15px; }
        #pantalla-exito p { font-size: 20px; margin-bottom: 30px; }
        .btn-descarga { display: inline-block; background-color: var(--primary-green); color: white; text-decoration: none; padding: 20px 40px; border-radius: 40px; font-weight: 700; font-size: 20px; box-shadow: 0 8px 25px rgba(0, 160, 70, 0.4); transition: transform 0.2s; }
        .btn-descarga:active { transform: scale(0.95); }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header id="app-header">
            <h1>🌎 Muestra 4R 🌿</h1>
            <p>Escaneá los 4 códigos para descubrir tu sorpresa.</p>
        </header>

        <div class="scanner-section" id="scanner-section">
            <div id="reader">
                <!-- Botón propio que forza el encendido -->
                <button id="btn-iniciar" class="btn-iniciar-camara" onclick="iniciarCamara()">📷 Activar Cámara</button>
            </div>
            <div id="feedback">Presioná el botón para comenzar</div>
        </div>

        <div class="badges-container" id="badges-container">
            <!-- Los círculos se generan por JavaScript -->
        </div>

        <div id="pantalla-exito">
            <h2>¡Misión Cumplida! 🎉</h2>
            <p>Completaste las 4 estaciones de nuestro proyecto.</p>
            <!-- REEMPLAZAR AQUÍ TU ENLACE DE DESCARGA -->
            <a href="https://tu-enlace-al-souvenir.com" target="_blank" class="btn-descarga">
                📥 Obtener Souvenir
            </a>
        </div>

    </div>

    <script>
        // REDUCIDO A SOLO 4 ESTACIONES
        const estaciones = [
            { id: "estacion1", titulo: "1°", codigoFisico: "REDUCIR" },
            { id: "estacion2", titulo: "2°", codigoFisico: "REUTILIZAR" },
            { id: "estacion3", titulo: "3°", codigoFisico: "RECICLAR" },
            { id: "estacion4", titulo: "4°", codigoFisico: "RECUPERAR" }
        ];

        let codigosEscaneados = new Set();
        const badgesContainer = document.getElementById('badges-container');
        let html5QrCode; // Variable global para la cámara
        
        // 1. Generar la interfaz para las 4 opciones
        estaciones.forEach((estacion) => {
            let wrapper = document.createElement('div');
            wrapper.className = 'badge-wrapper';
            wrapper.id = `wrapper-${estacion.id}`;

            let circle = document.createElement('div');
            circle.className = 'badge-circle';
            circle.innerText = estacion.titulo; 

            let check = document.createElement('div');
            check.className = 'badge-check';
            check.innerText = '✓';

            let label = document.createElement('div');
            label.className = 'badge-label';
            label.id = `label-${estacion.id}`;
            label.innerText = 'INCOMPLETO';

            circle.appendChild(check);
            wrapper.appendChild(circle);
            wrapper.appendChild(label);
            badgesContainer.appendChild(wrapper);
        });

        // 2. Nueva función para forzar el encendido de la cámara trasera
        function iniciarCamara() {
            const btn = document.getElementById('btn-iniciar');
            const feedback = document.getElementById('feedback');
            
            btn.style.display = 'none'; // Ocultamos nuestro botón
            feedback.innerText = "Cargando cámara...";

            // Usamos la clase directa, sin la interfaz por defecto de la librería
            html5QrCode = new Html5Qrcode("reader");

            html5QrCode.start(
                { facingMode: "environment" }, // Forza la cámara trasera
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess,
                (errorMessage) => { /* Ignoramos errores de escaneo en curso */ }
            ).then(() => {
                feedback.innerText = "Apuntá al código QR...";
            }).catch((err) => {
                // Si falla (por permisos o error del navegador)
                btn.style.display = 'block';
                feedback.innerText = "Error: Verifica los permisos de la cámara.";
                console.log(err);
            });
        }

        // 3. Lógica al leer un QR
        function onScanSuccess(decodedText) {
            const feedback = document.getElementById('feedback');
            const estacionEncontrada = estaciones.find(est => est.codigoFisico === decodedText);

            if (estacionEncontrada) {
                if (!codigosEscaneados.has(estacionEncontrada.id)) {
                    codigosEscaneados.add(estacionEncontrada.id);
                    
                    document.getElementById(`wrapper-${estacionEncontrada.id}`).classList.add('active');
                    document.getElementById(`label-${estacionEncontrada.id}`).innerText = 'COMPLETO';
                    
                    feedback.innerText = `¡Estación ${estacionEncontrada.titulo} registrada!`;
                    feedback.style.color = "var(--primary-green)";

                    verificarVictoria();
                } else {
                    feedback.innerText = `¡Ya visitaste la estación ${estacionEncontrada.titulo}!`;
                    feedback.style.color = "#d97706";
                }
            } else {
                feedback.innerText = "Código incorrecto para esta muestra.";
                feedback.style.color = "#dc2626";
            }
            
            // Regresar texto a la normalidad
            setTimeout(() => {
                if(codigosEscaneados.size < estaciones.length) {
                    feedback.innerText = "Apuntá al siguiente QR...";
                    feedback.style.color = "var(--text-dark)";
                }
            }, 3000);
        }

        function verificarVictoria() {
            if (codigosEscaneados.size === estaciones.length) {
                // Apagar la cámara correctamente
                html5QrCode.stop().then(() => {
                    document.getElementById('scanner-section').style.display = 'none';
                    document.getElementById('app-header').style.display = 'none';
                    document.getElementById('badges-container').style.display = 'none';
                    
                    let pantallaExito = document.getElementById('pantalla-exito');
                    pantallaExito.style.display = 'flex';
                }).catch(err => console.log("Error apagando cámara", err));
            }
        }
    </script>
</body>
</html>
